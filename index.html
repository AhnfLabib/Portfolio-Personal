<!doctype html>
<html lang="en" data-persona="dev">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ahnaf Labib — Engineer &amp; Artist</title>
    <meta
      name="description"
      content="Ahnaf Labib — a dual-persona portfolio. The Engineer builds LLM pipelines and web apps; the Artist shoots 35mm film, plays guitar, and designs. One button flips between the two."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Pre-hydration persona restore — set the theme attribute before first
      // paint so there is no flash of the wrong palette on reload.
      (function () {
        try {
          var p = localStorage.getItem("portfolio-persona");
          document.documentElement.dataset.persona =
            p === "creative" ? "creative" : "dev";
        } catch (e) {
          document.documentElement.dataset.persona = "dev";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Same srcset/sizes as the hero's large frame, so the preload fetches the file the img picks. -->
    <link
      rel="preload"
      as="image"
      href="/gallery/r4-02.jpg"
      imagesrcset="/gallery/r4-02-800.jpg 800w, /gallery/r4-02-1200.jpg 1200w, /gallery/r4-02.jpg 1600w"
      imagesizes="(min-width: 1024px) 83vw, 165vw"
      fetchpriority="high"
    />
    <!-- Fonts load without blocking first paint; display=swap shows fallbacks meanwhile. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400..800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400..800&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
