<!doctype html>
<html lang="en" data-persona="dev">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ahnaf Labib — Engineer &amp; Artist</title>
    <meta
      name="description"
      content="Ahnaf Labib — a dual-persona portfolio. The Engineer builds LLM pipelines and web apps; the Artist shoots 35mm film, plays guitar, and designs. One button flips between the two."
    />
    <link rel="icon" type="image/png" href="/assets/AL2.png" />
    <link rel="apple-touch-icon" href="/assets/AL2.png" />
    <script>
      // Pre-hydration persona restore — set the theme attribute before first
      // paint so there is no flash of the wrong palette on reload.
      (function () {
        try {
          var p = localStorage.getItem("portfolio-persona");
          document.documentElement.dataset.persona =
            p === "creative" ? "creative" : "dev";
        } catch (e) {
          document.documentElement.dataset.persona = "dev";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
